<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AR Brick Builder</title>
<style>
  :root { --panel: rgba(18, 20, 26, 0.76); --line: rgba(255,255,255,.13); --text: #f3f4f7; --muted: #aeb4bf; --accent: #f2b233; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 30%, #2d3443, #11141b); color: var(--text); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0; transition: opacity .4s; }
  #video.on { opacity: 1; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .panel { position: fixed; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(8px); }
  .hud { left: 16px; top: 16px; width: min(330px, calc(100vw - 32px)); padding: 10px 13px; }
  .hud h1 { margin: 0 0 4px; font-size: 16px; }
  .hud p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; }
  #status { color: var(--text); }
  .side { right: 16px; top: 16px; display: flex; flex-direction: column; gap: 6px; }
  .bar { left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 7px; max-width: calc(100vw - 32px); }
  button { border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text); padding: 8px 11px; border-radius: 10px; font: inherit; cursor: pointer; white-space: nowrap; }
  button:hover { background: rgba(255,255,255,.12); }
  button.on { background: var(--accent); color: #1c1606; border-color: transparent; font-weight: 600; }
  .swatch { width: 30px; height: 30px; padding: 0; border-radius: 8px; border: 2px solid rgba(255,255,255,.25); }
  .swatch.on { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.35); background-image: none; }
  .sep { width: 1px; height: 26px; background: var(--line); }
  .group { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
  .cursor { position: fixed; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 2px solid #7fc4e8; pointer-events: none; display: none; }
  .cursor.pinch { border-color: var(--accent); background: rgba(242,178,51,.35); }
  @media (max-width: 1000px) {
    .hud p.long { display: none; }
    .side { top: auto; right: 50%; transform: translateX(50%); flex-direction: row; }
  }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="gl"></canvas>
<div class="cursor" id="cur0"></div>
<div class="cursor" id="cur1"></div>
<div class="cursor" id="cur2"></div>

<div class="panel hud">
  <h1><a href="../" data-home-link title="Tüm atölyeler" style="color:inherit;text-decoration:none;opacity:.7;margin-right:6px;font-weight:400">←</a>🧱 AR Brick Builder</h1>
  <p id="status">Bir parça ve renk seç, zemine koy.</p>
  <p class="long">🤏 Pinch = yerleştir / sil / boya. Boş alanda pinch yapıp sürükle = sahneyi döndür. Pinch ile düğmelere de basabilirsin. 🖱️ Tık, sürükle, tekerlek = yakınlaştır. R = döndür, Ctrl+Z = geri al.</p>
</div>

<div class="panel side" id="side">
  <button data-tool="place" class="on">➕ Yerleştir</button>
  <button data-tool="erase">🗑️ Sil</button>
  <button data-tool="paint">🎨 Boya</button>
  <button id="btnRot">↻ Döndür</button>
</div>

<div class="panel bar" id="bar">
  <div class="group" id="sizes"></div>
  <span class="sep"></span>
  <div class="group" id="palette"></div>
  <span class="sep"></span>
  <button id="btnUndo">↶ Geri al</button>
  <button id="btnClear">🧹 Temizle</button>
  <button id="btnShot">📸 Fotoğraf</button>
  <button id="btnCam">📷 Kamera</button>
</div>

<script type="module">
import * as THREE from "three";

// ---------------------------------------------------------------------------
// Sahne
// ---------------------------------------------------------------------------
const canvas = document.getElementById("gl");
const video = document.getElementById("video");
const statusEl = document.getElementById("status");
const setStatus = (t) => (statusEl.textContent = t);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 200);
const view = { az: 0.6, el: 0.75, dist: 36, target: new THREE.Vector3(0, 2, 0) };
function placeCamera() {
  const { az, el, dist, target } = view;
  camera.position.set(target.x + dist * Math.cos(el) * Math.sin(az), target.y + dist * Math.sin(el), target.z + dist * Math.cos(el) * Math.cos(az));
  camera.lookAt(target);
}

scene.add(new THREE.HemisphereLight(0xffffff, 0x404858, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(14, 30, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 80 });
sun.shadow.bias = -0.0008;
scene.add(sun);

// Ölçüler (dünya birimi = 1 hücre)
const N = 20;            // taban 20 x 20 hücre
const H = 1.2;           // tuğla yüksekliği
const STUD_R = 0.3, STUD_H = 0.2;
const MAX_LAYER = 24;
const half = N / 2;

// Taban plakası
const plateGroup = new THREE.Group();
scene.add(plateGroup);
const plateMat = new THREE.MeshStandardMaterial({ color: 0x3f8f4f, roughness: 0.7 });
const plate = new THREE.Mesh(new THREE.BoxGeometry(N, 0.4, N), plateMat);
plate.position.y = -0.2;
plate.receiveShadow = true;
plate.userData.isPlate = true;
plateGroup.add(plate);
const studGeo = new THREE.CylinderGeometry(STUD_R, STUD_R, STUD_H, 16);
const plateStuds = new THREE.InstancedMesh(studGeo, plateMat, N * N);
{
  const m = new THREE.Matrix4(); let k = 0;
  for (let x = 0; x < N; x++) for (let z = 0; z < N; z++) plateStuds.setMatrixAt(k++, m.makeTranslation(x - half + 0.5, STUD_H / 2, z - half + 0.5));
}
plateStuds.receiveShadow = true;
plateGroup.add(plateStuds);

// ---------------------------------------------------------------------------
// Tuğlalar: { x, z (sol-ön hücre), layer, w, d, color }
// ---------------------------------------------------------------------------
const SIZES = [[1, 1], [1, 2], [1, 4], [2, 2], [2, 3], [2, 4], [2, 6]];
const PALETTE = [
  ["Kırmızı", "#c8312b"], ["Mavi", "#1f5fb8"], ["Sarı", "#f2c230"], ["Yeşil", "#2f8a43"], ["Turuncu", "#e8792b"],
  ["Beyaz", "#f3f2ee"], ["Açık gri", "#a3a7ab"], ["Siyah", "#25272b"], ["Kum", "#d8c08f"], ["Açık mavi", "#6fb6e6"],
];
let bricks = [];
let undo = [];
const sel = { size: [2, 4], color: PALETTE[0][1], rot: 0, tool: "place" };

const geoCache = new Map(), matCache = new Map();
function brickGeo(w, d) {
  const key = w + "x" + d;
  if (!geoCache.has(key)) {
    const body = new THREE.BoxGeometry(w - 0.04, H, d - 0.04);
    body.translate(w / 2, H / 2, d / 2);
    geoCache.set(key, body);
  }
  return geoCache.get(key);
}
function brickMat(c) {
  if (!matCache.has(c)) matCache.set(c, new THREE.MeshStandardMaterial({ color: c, roughness: 0.35, metalness: 0.0 }));
  return matCache.get(c);
}
function makeBrickMesh(b, mat) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(brickGeo(b.w, b.d), mat);
  body.castShadow = body.receiveShadow = true;
  g.add(body);
  const studs = new THREE.InstancedMesh(studGeo, mat, b.w * b.d);
  const m = new THREE.Matrix4(); let k = 0;
  for (let i = 0; i < b.w; i++) for (let j = 0; j < b.d; j++) studs.setMatrixAt(k++, m.makeTranslation(i + 0.5, H + STUD_H / 2, j + 0.5));
  studs.castShadow = true;
  g.add(studs);
  g.position.set(b.x - half, b.layer * H, b.z - half);
  return g;
}

const brickRoot = new THREE.Group();
scene.add(brickRoot);
function rebuild() {
  brickRoot.clear();
  bricks.forEach((b, i) => {
    const g = makeBrickMesh(b, brickMat(b.color));
    g.traverse((o) => (o.userData.brickIndex = i));
    brickRoot.add(g);
  });
  document.getElementById("btnUndo").disabled = !undo.length;
}

// Doluluk: hücre (x,z) ve katman
function occupied(x, z, layer) {
  return bricks.some((b) => b.layer === layer && x >= b.x && x < b.x + b.w && z >= b.z && z < b.z + b.d);
}
function columnTop(x, z) {
  let top = 0;
  for (const b of bricks) if (x >= b.x && x < b.x + b.w && z >= b.z && z < b.z + b.d) top = Math.max(top, b.layer + 1);
  return top;
}
function footprint() {
  const [w, d] = sel.size;
  return sel.rot % 2 ? [d, w] : [w, d];
}

// ---------------------------------------------------------------------------
// Hedefleme: ekran noktası -> tuğlanın konacağı yer (yerçekimiyle en üste oturur)
// ---------------------------------------------------------------------------
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function pick(sx, sy) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((sx - r.left) / r.width) * 2 - 1, -((sy - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects([plate, plateStuds, brickRoot], true);
  return hits[0] || null;
}

function targetFromHit(hit) {
  if (!hit) return null;
  const [w, d] = footprint();
  const p = hit.point.clone();
  // Çıkıntıya (stud) değmek = üst yüze değmek
  const n = hit.face && !hit.object.isInstancedMesh ? hit.face.normal.clone().transformDirection(hit.object.matrixWorld) : new THREE.Vector3(0, 1, 0);
  if (Math.abs(n.y) < 0.5) p.addScaledVector(n, 0.5); // yan yüze tıklanınca yanına koy
  const x = Math.round(p.x + half - w / 2), z = Math.round(p.z + half - d / 2);
  if (x < 0 || z < 0 || x + w > N || z + d > N) return { x, z, w, d, layer: 0, valid: false };
  let layer = 0;
  for (let i = x; i < x + w; i++) for (let j = z; j < z + d; j++) layer = Math.max(layer, columnTop(i, j));
  return { x, z, w, d, layer, valid: layer < MAX_LAYER };
}

// Önizleme ("hayalet") tuğla
const ghostMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.45, depthWrite: false });
let ghost = null, ghostKey = "";
function showGhost(t) {
  const key = t ? [t.x, t.z, t.w, t.d, t.layer, t.valid, sel.color].join() : "";
  if (key === ghostKey) return;
  ghostKey = key;
  if (ghost) { scene.remove(ghost); ghost = null; }
  if (!t) return;
  ghostMat.color.set(t.valid ? sel.color : "#ff3030");
  ghost = makeBrickMesh({ ...t, color: sel.color }, ghostMat);
  ghost.traverse((o) => (o.castShadow = false));
  scene.add(ghost);
}

// Silme/boyama hedefi vurgusu
const hoverBox = new THREE.BoxHelper(new THREE.Object3D(), 0xffffff);
hoverBox.visible = false;
scene.add(hoverBox);

// ---------------------------------------------------------------------------
// Eylemler
// ---------------------------------------------------------------------------
function snapshot() { undo.push(bricks.map((b) => ({ ...b }))); if (undo.length > 60) undo.shift(); }

function act(sx, sy) {
  const hit = pick(sx, sy);
  if (!hit) return false;
  const idx = hit.object.userData.brickIndex;
  if (sel.tool === "place") {
    const t = targetFromHit(hit);
    if (!t || !t.valid) { setStatus(t ? "Buraya sığmıyor." : ""); return true; }
    snapshot();
    bricks.push({ x: t.x, z: t.z, layer: t.layer, w: t.w, d: t.d, color: sel.color });
    setStatus(`${bricks.length} parça · ${t.w}×${t.d} konuldu (kat ${t.layer + 1}).`);
  } else if (idx != null) {
    snapshot();
    if (sel.tool === "erase") { bricks.splice(idx, 1); setStatus(`Parça silindi · ${bricks.length} parça.`); }
    else { bricks[idx].color = sel.color; setStatus("Parça boyandı."); }
  } else return false; // tabana boya/sil = sahneyi döndürmeye izin ver
  rebuild(); ghostKey = "#";
  return true;
}

function updateHover(sx, sy) {
  if (sx == null) { showGhost(null); hoverBox.visible = false; return; }
  const hit = pick(sx, sy);
  if (sel.tool === "place") { hoverBox.visible = false; showGhost(targetFromHit(hit)); return; }
  showGhost(null);
  const idx = hit?.object.userData.brickIndex;
  if (idx != null) { hoverBox.setFromObject(brickRoot.children[idx]); hoverBox.material.color.set(sel.tool === "erase" ? 0xff4040 : sel.color); hoverBox.visible = true; }
  else hoverBox.visible = false;
}

// ---------------------------------------------------------------------------
// Arayüz
// ---------------------------------------------------------------------------
const sizesEl = document.getElementById("sizes");
SIZES.forEach(([w, d]) => {
  const b = document.createElement("button");
  b.textContent = `${w}×${d}`; b.dataset.size = `${w}x${d}`;
  b.classList.toggle("on", w === sel.size[0] && d === sel.size[1]);
  b.onclick = () => { sel.size = [w, d]; sizesEl.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); setTool("place"); ghostKey = "#"; };
  sizesEl.appendChild(b);
});
const palEl = document.getElementById("palette");
PALETTE.forEach(([name, c], i) => {
  const b = document.createElement("button");
  b.className = "swatch" + (i === 0 ? " on" : ""); b.style.background = c; b.title = name; b.dataset.color = c;
  b.onclick = () => { sel.color = c; palEl.querySelectorAll(".swatch").forEach((x) => x.classList.toggle("on", x === b)); setStatus(`Renk: ${name}`); ghostKey = "#"; };
  palEl.appendChild(b);
});
function setTool(t) {
  sel.tool = t;
  document.querySelectorAll("#side [data-tool]").forEach((b) => b.classList.toggle("on", b.dataset.tool === t));
  setStatus({ place: "Yerleştir: parçayı zemine ya da başka bir parçanın üstüne koy.", erase: "Sil: kaldırmak istediğin parçaya dokun.", paint: "Boya: renk seç, parçaya dokun." }[t]);
}
document.querySelectorAll("#side [data-tool]").forEach((b) => (b.onclick = () => setTool(b.dataset.tool)));
const rotate = () => { sel.rot = (sel.rot + 1) % 2; ghostKey = "#"; setStatus("Parça döndürüldü."); };
document.getElementById("btnRot").onclick = rotate;
document.getElementById("btnUndo").onclick = () => { const s = undo.pop(); if (!s) return; bricks = s; rebuild(); ghostKey = "#"; setStatus("Geri alındı."); };
document.getElementById("btnClear").onclick = () => { if (!bricks.length) return; snapshot(); bricks = []; rebuild(); ghostKey = "#"; setStatus("Taban temizlendi."); };
document.getElementById("btnShot").onclick = () => {
  const out = document.createElement("canvas"); out.width = canvas.width; out.height = canvas.height;
  const g = out.getContext("2d");
  if (camOn) {
    const vw = video.videoWidth, vh = video.videoHeight, s = Math.max(out.width / vw, out.height / vh);
    g.save(); g.translate(out.width, 0); g.scale(-1, 1); g.drawImage(video, (out.width - vw * s) / 2, (out.height - vh * s) / 2, vw * s, vh * s); g.restore();
  } else { g.fillStyle = "#1c2029"; g.fillRect(0, 0, out.width, out.height); }
  g.drawImage(canvas, 0, 0);
  const a = document.createElement("a"); a.download = `yapi-${Date.now()}.png`; a.href = out.toDataURL("image/png"); a.click();
  setStatus("Fotoğraf kaydedildi.");
};
addEventListener("keydown", (e) => {
  if (e.key === "r" || e.key === "R") rotate();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") document.getElementById("btnUndo").click();
  if (e.key === "1") setTool("place"); if (e.key === "2") setTool("erase"); if (e.key === "3") setTool("paint");
});

// ---------------------------------------------------------------------------
// Giriş: el (MediaPipe) + fare
// ---------------------------------------------------------------------------
const cursors = [0, 1, 2].map((i) => document.getElementById("cur" + i));
const hands = [null, null];
const mouse = { down: false, x: -1, y: -1, over: false };
let landmarker = null, camOn = false, lastVideoTime = -1;

canvas.addEventListener("pointerdown", (e) => { mouse.down = true; mouse.x = e.clientX; mouse.y = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.over = true; });
canvas.addEventListener("pointerleave", () => (mouse.over = false));
addEventListener("pointerup", () => (mouse.down = false));
canvas.addEventListener("wheel", (e) => { e.preventDefault(); view.dist = THREE.MathUtils.clamp(view.dist * (1 + Math.sign(e.deltaY) * 0.08), 14, 70); placeCamera(); ghostKey = "#"; }, { passive: false });

async function loadLandmarker() {
  setStatus("El takibi modeli yükleniyor…");
  const { FilesetResolver, HandLandmarker } = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
  const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = (delegate) => ({
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate },
    runningMode: "VIDEO", numHands: 2, minHandDetectionConfidence: 0.6, minTrackingConfidence: 0.5,
  });
  try { return await HandLandmarker.createFromOptions(files, opts("GPU")); }
  catch { return await HandLandmarker.createFromOptions(files, opts("CPU")); }
}
async function toggleCamera() {
  const btn = document.getElementById("btnCam");
  if (camOn) {
    video.srcObject?.getTracks().forEach((t) => t.stop());
    video.srcObject = null; video.classList.remove("on"); camOn = false; hands[0] = hands[1] = null;
    btn.textContent = "📷 Kamera"; setStatus("Kamera kapalı."); return;
  }
  try {
    btn.disabled = true;
    if (!landmarker) landmarker = await loadLandmarker();
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }, audio: false });
    video.srcObject = stream; await video.play();
    video.classList.add("on"); camOn = true; btn.textContent = "📷 Kapat";
    setStatus("Elini göster. Pinch = koy; boş alanda pinch + sürükle = döndür.");
  } catch (err) { console.error(err); setStatus("Kamera açılamadı: " + (err?.message || err)); }
  finally { btn.disabled = false; }
}
document.getElementById("btnCam").onclick = toggleCamera;

function videoToScreen(nx, ny) {
  const W = innerWidth, Hh = innerHeight, vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
  const s = Math.max(W / vw, Hh / vh), dw = vw * s, dh = vh * s;
  return { x: (W - dw) / 2 + (1 - nx) * dw, y: (Hh - dh) / 2 + ny * dh };
}

// --- Kararlı el işaretçisi -------------------------------------------------
// One Euro filtresi: el yavaşken titreşimi güçlü biçimde bastırır,
// hızlı hareket ederken gecikmeyi azaltır.
class OneEuro {
  constructor(minCutoff = 1.0, beta = 0.004, dCutoff = 1.0) { Object.assign(this, { minCutoff, beta, dCutoff, x: null, dx: 0, t: 0 }); }
  static alpha(cutoff, dt) { const tau = 1 / (2 * Math.PI * cutoff); return 1 / (1 + tau / dt); }
  filter(x, t) {
    if (this.x === null) { this.x = x; this.t = t; return x; }
    const dt = Math.max(1e-3, t - this.t); this.t = t;
    this.dx += OneEuro.alpha(this.dCutoff, dt) * ((x - this.x) / dt - this.dx);
    const cutoff = this.minCutoff + this.beta * Math.abs(this.dx);
    this.x += OneEuro.alpha(cutoff, dt) * (x - this.x);
    return this.x;
  }
}
const STABILITY = { minCutoff: 0.5, beta: 0.004 }; // minCutoff küçüldükçe daha durgun, beta büyüdükçe daha çevik
const newHandFilter = () => ({ x: new OneEuro(STABILITY.minCutoff, STABILITY.beta), y: new OneEuro(STABILITY.minCutoff, STABILITY.beta), pinchVotes: 0, raw: null });
const handFilters = [newHandFilter(), newHandFilter()];

function readHands() {
  if (!camOn || !landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  let lms = (landmarker.detectForVideo(video, performance.now()).landmarks || []).slice(0, 2);
  // İki el varsa sıra kareden kareye değişebilir: önceki konumlara en yakın eşleşmeyi koru
  if (lms.length === 2 && handFilters[0].raw && handFilters[1].raw) {
    const d = (lm, f) => Math.hypot(lm[0].x - f.raw.x, lm[0].y - f.raw.y);
    if (d(lms[0], handFilters[1]) + d(lms[1], handFilters[0]) < d(lms[0], handFilters[0]) + d(lms[1], handFilters[1])) lms = [lms[1], lms[0]];
  }
  const t = performance.now() / 1000;
  for (let h = 0; h < 2; h++) {
    const lm = lms[h];
    if (!lm) { hands[h] = null; handFilters[h] = newHandFilter(); continue; }
    const f = handFilters[h];
    f.raw = { x: lm[0].x, y: lm[0].y };
    const thumb = lm[4], index = lm[8], knuckle = lm[5];
    // Sabit referans noktası: iki parmak ucu + işaret parmağı kökü.
    // Pinch açılıp kapanırken iki uç simetrik yaklaştığı için nokta zıplamaz.
    const nx = thumb.x * 0.35 + index.x * 0.35 + knuckle.x * 0.3;
    const ny = thumb.y * 0.35 + index.y * 0.35 + knuckle.y * 0.3;
    const sp = videoToScreen(nx, ny);
    const x = f.x.filter(sp.x, t), y = f.y.filter(sp.y, t);
    // Pinch: histerezis + durum değişikliği için 2 kare onay (titrek tıklamaları önler)
    const size = Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y) || 0.1;
    const ratio = Math.hypot(thumb.x - index.x, thumb.y - index.y) / size;
    const was = !!hands[h]?.pinch;
    const want = was ? ratio < 0.45 : ratio < 0.32;
    f.pinchVotes = want !== was ? f.pinchVotes + 1 : 0;
    const pinch = f.pinchVotes >= 2 ? want : was;
    if (f.pinchVotes >= 2) f.pinchVotes = 0;
    hands[h] = { x, y, pinch };
  }
}


const wasActive = {};
let orbit = null; // { id, x, y, az, el }
function handleInput() {
  const list = [];
  hands.forEach((h, i) => h && list.push({ id: "h" + i, x: h.x, y: h.y, active: h.pinch, hand: true }));
  if (mouse.over || mouse.down) list.push({ id: "mouse", x: mouse.x, y: mouse.y, active: mouse.down, hand: false });

  for (const t of list) {
    const started = t.active && !wasActive[t.id];
    if (!started) continue;
    if (t.hand) {
      const el = document.elementFromPoint(t.x, t.y)?.closest("button");
      if (el && !el.closest("#gl")) { el.click(); continue; }
    }
    if (!act(t.x, t.y)) orbit = { id: t.id, x: t.x, y: t.y, az: view.az, el: view.el };
  }
  if (orbit) {
    const o = list.find((t) => t.id === orbit.id);
    if (!o || !o.active) orbit = null;
    else {
      view.az = orbit.az - (o.x - orbit.x) * 0.008;
      view.el = THREE.MathUtils.clamp(orbit.el + (o.y - orbit.y) * 0.006, 0.2, 1.45);
      placeCamera();
    }
  }
  for (const id of ["h0", "h1", "mouse"]) wasActive[id] = !!list.find((t) => t.id === id)?.active;

  // Önizleme: önce el, yoksa fare
  const pointer = list.find((t) => t.hand) || list.find((t) => t.id === "mouse");
  updateHover(orbit ? null : pointer?.x, pointer?.y);

  cursors.forEach((c, i) => {
    const t = list.filter((x) => x.hand)[i];
    if (!t) { c.style.display = "none"; return; }
    c.style.display = "block"; c.style.left = t.x + "px"; c.style.top = t.y + "px";
    c.classList.toggle("pinch", t.active);
  });
}

// ---------------------------------------------------------------------------
// Döngü
// ---------------------------------------------------------------------------
function resize() {
  // Dar ekranda araç paneli paletin hemen üstünde
  document.getElementById("side").style.bottom = innerWidth <= 1000 ? document.getElementById("bar").offsetHeight + 24 + "px" : "";
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  if (innerWidth / innerHeight < 0.9) view.dist = Math.max(view.dist, 52);
  camera.updateProjectionMatrix();
  placeCamera();
}
addEventListener("resize", resize);
resize();
rebuild();
setTool("place");

function frame() {
  readHands();
  handleInput();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__brick = { get bricks() { return bricks; }, act, pick, targetFromHit, sel, setTool, rebuild, camera, view, placeCamera, THREE, render: () => renderer.render(scene, camera) };
</script>

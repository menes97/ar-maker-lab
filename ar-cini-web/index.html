<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AR Çini Atölyesi</title>
<style>
  :root { --panel: rgba(14, 20, 34, 0.78); --line: rgba(255,255,255,.13); --text: #f3f1ec; --muted: #b3b8c0; --accent: #1f4e9c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 30%, #22324a, #0b111c); color: var(--text); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0; transition: opacity .4s; }
  #video.on { opacity: 1; }
  #tile { position: fixed; border-radius: 4px; box-shadow: 0 0 0 3px #d9cfba, 0 0 0 5px #6b5a43, 0 18px 50px rgba(0,0,0,.55); touch-action: none; cursor: none; background: #f6f0e2; }
  #overlay { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hud { position: fixed; left: 16px; top: 16px; width: min(330px, calc(100vw - 32px)); padding: 10px 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(8px); }
  .hud h1 { margin: 0 0 4px; font-size: 16px; }
  .hud p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; }
  #status { color: var(--text); }
  .tools { position: fixed; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 6px; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(8px); }
  .tools button, .bar button { border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text); padding: 8px 11px; border-radius: 10px; font: inherit; cursor: pointer; text-align: left; white-space: nowrap; }
  .tools button.on { background: var(--accent); border-color: transparent; font-weight: 600; }
  .tools button small { display: block; color: var(--muted); font-size: 11px; }
  .tools button.on small { color: #e3ecfa; }
  #opts { left: 16px; right: auto; width: min(330px, calc(100vw - 32px)); overflow-y: auto; }
  #opts .grp { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  #opts .grp + .grp { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
  #opts .ttl { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
  #opts button { padding: 6px 9px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
  #opts button.wide { grid-column: 1 / -1; }
  .bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(8px); max-width: calc(100vw - 32px); }
  .bar button.fire { background: linear-gradient(135deg, #c23a2b, #e0773a); border-color: transparent; font-weight: 600; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); cursor: pointer; padding: 0; }
  .swatch.on { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.35); transform: scale(1.1); }
  .sep { width: 1px; height: 26px; background: var(--line); }
  input[type=color] { width: 34px; height: 30px; border: none; background: none; padding: 0; cursor: pointer; }
  label.size { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  @media (max-width: 1000px) {
    .hud p.long { display: none; }
    .tools { top: auto; bottom: 120px; flex-direction: row; flex-wrap: wrap; justify-content: center; right: 50%; transform: translateX(50%); max-width: calc(100vw - 32px); }
    .tools button small { display: none; }
    #opts { left: 50%; right: auto; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); }
    #opts .grp { display: flex; flex-wrap: wrap; justify-content: center; }
    #opts .grp + .grp { margin-top: 0; padding-top: 0; border-top: none; }
    #opts .ttl { display: none; }
    #opts button { padding: 5px 8px; font-size: 12px; }
  }
</style>
<style id="mobil">
/* Telefon düzeni (genişlik ≤700px ya da yükseklik ≤500px, yatay telefon): üstte ince başlık şeridi, altta yana kayan tek satırlık şeritler.
   Çalışma alanı aradaki boşluğu doldurur. Satır yüksekliği --row. */
@media (max-width: 700px), (max-height: 500px) {
  :root { --row: 54px; --safe: env(safe-area-inset-bottom, 0px); }
  .hud {
    left: 8px !important; right: 8px !important; top: 8px !important; width: auto !important; max-width: none !important;
    padding: 6px 10px !important; border-radius: 10px !important;
  }
  .hud h1 { font-size: 14px !important; margin: 0 !important; }
  .hud p.long { display: none !important; }
  .hud p, .hud .step, .hud #progText { font-size: 12px !important; margin: 2px 0 0 !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud .prog { margin-top: 4px !important; }

  /* Alt şeritler: tek satır, yana kaydırılır */
  .bar, .tools, #side, #opts {
    position: fixed !important; left: 0 !important; right: 0 !important; top: auto !important;
    transform: none !important; width: auto !important; max-width: none !important; height: var(--row);
    display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; align-items: center !important;
    justify-content: flex-start !important; gap: 6px !important;
    overflow-x: auto !important; overflow-y: hidden !important; overscroll-behavior-x: contain;
    padding: 6px 10px !important; border-radius: 0 !important; border-left: 0 !important; border-right: 0 !important;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
    -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent);
  }
  .bar::-webkit-scrollbar, .tools::-webkit-scrollbar, #side::-webkit-scrollbar, #opts::-webkit-scrollbar { display: none; }
  .bar { bottom: 0 !important; height: calc(var(--row) + var(--safe)); padding-bottom: calc(6px + var(--safe)) !important; }
  .tools, #side { bottom: calc(var(--row) + var(--safe)) !important; }
  #opts { bottom: calc(2 * var(--row) + var(--safe)) !important; }

  /* Şerit içindeki gruplar da tek satır */
  .bar > *, .tools > *, #side > *, #opts > * { flex: 0 0 auto !important; }
  .bar .group, .bar #palette, .bar #sizes, .tools .grp, #opts .grp, .tools .slot, .tools .chars, #patterns, #palette {
    display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; align-items: center !important; gap: 6px !important;
    margin: 0 !important; padding: 0 !important; border: 0 !important; background: none !important;
  }
  #patterns.hidden, #patGrp.hidden { display: none !important; }
  .tools .slot h2 { margin: 0 4px 0 0 !important; font-size: 12px !important; white-space: nowrap; }
  .tools .slot h2 small { display: none; }
  .tools .slot + .slot { border-left: 1px solid rgba(255,255,255,.15) !important; padding-left: 8px !important; }

  /* Dokunmaya uygun boyutlar */
  .bar button, .tools button, #side button, #opts button { min-height: 40px !important; padding: 6px 11px !important; white-space: nowrap; }
  .tools button small, #side button small { display: none !important; }
  .swatch { width: 36px !important; height: 36px !important; min-height: 36px !important; padding: 0 !important; flex: 0 0 auto; }
  .bar .sep { height: 26px !important; }
  input[type=color] { width: 36px !important; height: 36px !important; flex: 0 0 auto; }
  label.size, label.chk { white-space: nowrap; }
  label.size input[type=range] { width: 90px; height: 32px !important; }
  label.chk input[type=checkbox] { width: 22px !important; height: 22px !important; }
  a[data-home-link] { display: inline-block; min-width: 34px; min-height: 34px; line-height: 34px; text-align: center; margin: -8px 0 -8px -8px !important; }
}
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="tile"></canvas>
<canvas id="overlay"></canvas>

<div class="hud">
  <h1><a href="../" data-home-link title="Tüm atölyeler" style="color:inherit;text-decoration:none;opacity:.7;margin-right:6px;font-weight:400">←</a>🔷 AR Çini Atölyesi</h1>
  <p id="status">Bir alet ve renk seç, karoya dokun.</p>
  <p class="long">🤏 Başparmak + işaret parmağını birleştir (pinch) = fırça karoya değer. Pinch ile düğmelere de basabilirsin. 🖱️ Fare: basılı tut. Kısayol: 1–5 alet, S simetri, P pano, G kılavuz, Ctrl+Z geri al.</p>
</div>

<div class="tools" id="opts">
  <div class="grp">
    <span class="ttl">Karo</span>
    <button id="btnSym">✳️ Simetri: 8'li</button>
    <button id="btnGuides">📐 Kılavuz: açık</button>
    <button id="btnPano">🧱 Pano: kapalı</button>
    <button id="btnPanoMirror">🪞 Ayna tekrar: kapalı</button>
    <button id="btnErase" class="wide">🧹 Silgi katmanı: boya</button>
  </div>
  <div class="grp" id="motifs">
    <span class="ttl">Damga motifi</span>
    <button data-motif="lale">🌷 Lale</button>
    <button data-motif="karanfil">🌺 Karanfil</button>
    <button data-motif="rumi">🍃 Rumi</button>
    <button data-motif="hatayi">🏵️ Hatayi</button>
    <button data-motif="bulut">☁️ Çin bulutu</button>
  </div>
  <div class="grp">
    <span class="ttl">Hazır şablon (boyama modu)</span>
    <button data-tpl="rozet">🌸 Rozet + köşebent</button>
    <button data-tpl="vazo">🏺 Lale vazo</button>
    <button data-tpl="yildiz" class="wide">⭐ Sekiz köşeli yıldız</button>
  </div>
</div>

<div class="tools" id="tools">
  <button data-tool="tahrir" class="on">🖋️ Tahrir <small>ince kontur çizer</small></button>
  <button data-tool="brush">🖌️ Fırça <small>yumuşak boya</small></button>
  <button data-tool="stamp">🌷 Motif damgası <small>bas, sürükle = döndür</small></button>
  <button data-tool="fill">🪣 Doldur <small>konturlu alanı boyar</small></button>
  <button data-tool="eraser">🧽 Silgi <small>siler</small></button>
</div>

<div class="bar" id="bar">
  <div id="palette" style="display:flex; gap:6px; flex-wrap:wrap"></div>
  <input type="color" id="custom" value="#d9a521" title="Özel renk" />
  <span class="sep"></span>
  <label class="size">Boyut <input type="range" id="size" min="0.4" max="2.5" step="0.1" value="1" /></label>
  <span class="sep"></span>
  <button id="btnUndo">↶ Geri al</button>
  <button id="btnClear">🗑️ Temizle</button>
  <button id="btnFire" class="fire">🔥 Sırla &amp; fırınla</button>
  <button id="btnPanoPng">🧱 Pano PNG</button>
  <button id="btnCam">📷 Kamera</button>
</div>

<script type="module">
// ---------------------------------------------------------------------------
// Karo: 800×800. İki katman: boya (altta) + tahrir/kontur (üstte).
// Doldurma ve fırça yalnızca boya katmanına yazar; konturlar bozulmaz.
// ---------------------------------------------------------------------------
const TILE = 800, C = TILE / 2;
const mk = (w, h = w) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const view = document.getElementById("tile");
const vctx = view.getContext("2d");
view.width = view.height = TILE;
const overlay = document.getElementById("overlay");
const octx = overlay.getContext("2d");
const video = document.getElementById("video");
const statusEl = document.getElementById("status");
const setStatus = (t) => (statusEl.textContent = t);

const paint = mk(TILE), pctx = paint.getContext("2d");
const contour = mk(TILE), cctx = contour.getContext("2d");
const comp = mk(TILE), compCtx = comp.getContext("2d");
let undo = [];
let dirty = true;
let fired = null, showFired = false;

// Basit tohumlu rastgele sayı (sır çatlakları ve zemin dokusu hep aynı çıksın)
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hexToRgb = (h) => { const n = parseInt(h.replace("#", ""), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const rgba = (h, a) => { const [r, g, b] = hexToRgb(h); return `rgba(${r},${g},${b},${a})`; };

// Sırlı krem zemin
const ground = mk(TILE);
{
  const g = ground.getContext("2d");
  g.fillStyle = "#f6f0e2"; g.fillRect(0, 0, TILE, TILE);
  const img = g.getImageData(0, 0, TILE, TILE), px = img.data, r = rng(7);
  for (let i = 0; i < px.length; i += 4) { const n = (r() - 0.5) * 7; px[i] += n; px[i + 1] += n; px[i + 2] += n * 1.2; }
  g.putImageData(img, 0, 0);
  const v = g.createRadialGradient(C, C, TILE * 0.3, C, C, TILE * 0.75);
  v.addColorStop(0, "rgba(255,250,240,0)"); v.addColorStop(1, "rgba(170,140,95,0.10)");
  g.fillStyle = v; g.fillRect(0, 0, TILE, TILE);
}

// ---------------------------------------------------------------------------
// Simetri: her vuruş merkez etrafında dönme / ayna kopyalarıyla çoğaltılır
// ---------------------------------------------------------------------------
const SYM_MODES = ["off", "r4", "r6", "r8", "mirror", "kaleido"];
const SYM_NAMES = { off: "kapalı", r4: "4'lü", r6: "6'lı", r8: "8'li", mirror: "ayna ↔", kaleido: "kaleydoskop" };
let sym = "r8";
let guides = true;
function symMatrices(mode = sym) {
  const rot = (t) => [Math.cos(t), Math.sin(t), -Math.sin(t), Math.cos(t)];
  const ref = (p) => [Math.cos(2 * p), Math.sin(2 * p), Math.sin(2 * p), -Math.cos(2 * p)];
  if (mode === "off") return [[1, 0, 0, 1]];
  if (mode === "mirror") return [[1, 0, 0, 1], [-1, 0, 0, 1]];
  if (mode === "kaleido") { const out = []; for (let i = 0; i < 4; i++) out.push(rot((i * Math.PI) / 2), ref((i * Math.PI) / 4)); return out; }
  const n = Number(mode.slice(1)), out = [];
  for (let i = 0; i < n; i++) out.push(rot((i * 2 * Math.PI) / n));
  return out;
}
const setM = (g, M) => g.setTransform(M[0], M[1], M[2], M[3], C - M[0] * C - M[2] * C, C - M[1] * C - M[3] * C);
function eachSym(g, fn, mats = symMatrices()) { for (const M of mats) { setM(g, M); fn(); } g.setTransform(1, 0, 0, 1, 0, 0); }
const mapPt = (M, x, y) => [M[0] * (x - C) + M[2] * (y - C) + C, M[1] * (x - C) + M[3] * (y - C) + C];

function drawGuides(g) {
  g.save();
  g.strokeStyle = "rgba(30,80,160,.25)"; g.lineWidth = 1.5; g.setLineDash([8, 10]);
  const R = TILE * 0.72;
  const line = (a, both) => { g.beginPath(); g.moveTo(C - (both ? Math.sin(a) * R : 0), C + (both ? Math.cos(a) * R : 0)); g.lineTo(C + Math.sin(a) * R, C - Math.cos(a) * R); g.stroke(); };
  if (sym[0] === "r") { const n = Number(sym.slice(1)); for (let i = 0; i < n; i++) line(((i + 0.5) * 2 * Math.PI) / n, false); }
  else if (sym === "mirror") line(0, true);
  else if (sym === "kaleido") for (let i = 0; i < 4; i++) line((i * Math.PI) / 4, true);
  if (sym !== "off") { g.beginPath(); g.arc(C, C, 6, 0, Math.PI * 2); g.stroke(); }
  g.restore();
}

// ---------------------------------------------------------------------------
// Yordamsal vektör motifler (100 birimlik kutu, merkez 0,0, uç yukarı)
// ---------------------------------------------------------------------------
function cubic(start, segs, { mirror = false, close = true, rot = 0, sc = 1 } = {}) {
  const m = mirror ? -1 : 1, cs = Math.cos(rot), sn = Math.sin(rot);
  const T = (x, y) => { x *= m * sc; y *= sc; return [x * cs - y * sn, x * sn + y * cs]; };
  const p = new Path2D();
  p.moveTo(...T(start[0], start[1]));
  for (const s of segs) p.bezierCurveTo(...T(s[0], s[1]), ...T(s[2], s[3]), ...T(s[4], s[5]));
  if (close) p.closePath();
  return p;
}
function circle(x, y, r) { const p = new Path2D(); p.arc(x, y, r, 0, Math.PI * 2); return p; }

function buildLale() {
  const body = cubic([0, 8], [[-18, 6, -22, -14, -16, -30], [-12, -22, -8, -20, -6, -22], [-8, -36, -4, -46, 0, -52], [4, -46, 8, -36, 6, -22], [8, -20, 12, -22, 16, -30], [22, -14, 18, 6, 0, 8]]);
  const leaf = (mirror) => cubic([0, 42], [[-20, 32, -30, 12, -28, -4], [-18, 8, -8, 22, 0, 34]], { mirror });
  const stem = cubic([0, 8], [[-2, 24, 2, 36, 0, 50]], { close: false });
  const pl = (mirror) => cubic([-6, -22], [[-6, -12, -3, -3, -1, 5]], { mirror, close: false });
  return { fills: [leaf(false), leaf(true), body], lines: [stem, pl(false), pl(true)] };
}
function buildKaranfil() {
  const c = [0, -6], R = 40, N = 7, a0 = -Math.PI + 0.25, a1 = -0.25, da = (a1 - a0) / N;
  const P = (a, r) => [c[0] + Math.cos(a) * r, c[1] + Math.sin(a) * r];
  const fan = new Path2D();
  fan.moveTo(-9, -2); fan.lineTo(...P(a0, R));
  for (let i = 0; i < N; i++) {
    const a = a0 + i * da;
    fan.quadraticCurveTo(...P(a + da * 0.25, R + 11), ...P(a + da * 0.5, R + 2));
    fan.quadraticCurveTo(...P(a + da * 0.75, R + 11), ...P(a + da, R));
  }
  fan.lineTo(9, -2); fan.quadraticCurveTo(0, 2, -9, -2); fan.closePath();
  const calyx = cubic([-9, -2], [[-12, 10, -6, 18, 0, 22], [6, 18, 12, 10, 9, -2]]);
  const leaf = (mirror) => cubic([0, 40], [[10, 34, 22, 34, 32, 26], [24, 40, 12, 44, 0, 44]], { mirror });
  const lines = new Path2D();
  for (let i = 1; i < N; i++) { const a = a0 + i * da; lines.moveTo(...P(a, R * 0.42)); lines.lineTo(...P(a, R - 1)); }
  lines.moveTo(...P(a0 + 0.05, R * 0.42)); lines.arc(c[0], c[1], R * 0.42, a0 + 0.05, a1 - 0.05);
  const stem = cubic([0, 22], [[2, 32, -2, 42, 0, 52]], { close: false });
  return { fills: [leaf(false), leaf(true), fan, calyx], lines: [lines, stem] };
}
function buildRumi() {
  const wing = (mirror) => cubic([2, -50], [[20, -40, 40, -20, 38, 5], [36, 25, 20, 38, 2, 45], [12, 32, 18, 22, 18, 12], [12, 16, 6, 18, 3, 18], [10, 10, 16, 0, 16, -10], [10, -6, 6, -4, 3, -4], [8, -16, 8, -34, 2, -50]], { mirror });
  const drop = cubic([0, -26], [[3, -16, 3, -6, 0, 4], [-3, -6, -3, -16, 0, -26]]);
  return { fills: [wing(false), wing(true), drop], lines: [] };
}
const BIG_PETAL = [[0, -60], [[28, -72, 40, -112, 0, -146], [-40, -112, -28, -72, 0, -60]]];
const BIG_PETAL_IN = [[0, -78], [[14, -88, 18, -110, 0, -132], [-18, -110, -14, -88, 0, -78]]];
function buildHatayi() {
  const fills = [];
  for (let k = 0; k < 8; k++) fills.push(cubic([0, -10], [[12, -14, 18, -32, 7, -46], [3, -44, 1, -41, 0, -40], [-1, -41, -3, -44, -7, -46], [-18, -32, -12, -14, 0, -10]], { rot: (k * Math.PI) / 4 }));
  for (let k = 0; k < 8; k++) fills.push(cubic([0, -8], [[6, -12, 8, -22, 0, -30], [-8, -22, -6, -12, 0, -8]], { rot: (k * Math.PI) / 4 + Math.PI / 8 }));
  fills.push(circle(0, 0, 9));
  return { fills, lines: [circle(0, 0, 4)] };
}
function buildBulut() {
  // "Kaplumbağa" yöntemi: ortadan başlayıp eğriliği artarak kıvrılan S-kuşak
  const half = []; let x = 0, y = 0, th = -0.35; const L = 70, n = 90, ds = L / n;
  for (let i = 0; i <= n; i++) { const u = i / n; half.push([x, y, u]); th += (0.012 + 0.32 * u ** 2.5) * ds; x += Math.cos(th) * ds; y += Math.sin(th) * ds; }
  const pts = [...half.slice(1).reverse().map(([x, y, u]) => [-x, -y, u]), ...half];
  let mx = 0; for (const [x, y] of pts) mx = Math.max(mx, Math.abs(x) + 10, Math.abs(y) + 10);
  const s = 46 / mx, left = [], right = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    const w = 1.5 + 8.5 * (1 - pts[i][2]) ** 0.9;
    left.push([(pts[i][0] - ty * w) * s, (pts[i][1] + tx * w) * s]);
    right.push([(pts[i][0] + ty * w) * s, (pts[i][1] - tx * w) * s]);
  }
  const band = new Path2D();
  band.moveTo(...left[0]); for (const p of left) band.lineTo(...p);
  for (let i = right.length - 1; i >= 0; i--) band.lineTo(...right[i]);
  band.closePath();
  const mid = new Path2D(); let started = false;

function fillSeeds(seeds, hex, tol = fillTol) {
  const N = TILE, [fr, fg, fb] = hexToRgb(hex);
  const pimg = pctx.getImageData(0, 0, N, N), p = pimg.data;
  const cdat = cctx.getImageData(0, 0, N, N).data;
  const bar = new Uint8Array(N * N);
  for (let i = 0, j = 3; i < bar.length; i++, j += 4) bar[i] = cdat[j] > 90 ? 1 : 0;
  let changed = false;
  for (const [sx0, sy0] of seeds) {
    const sx = Math.round(sx0), sy = Math.round(sy0);
    if (sx < 0 || sy < 0 || sx >= N || sy >= N) continue;
    const s = sy * N + sx;
    if (bar[s]) continue;
    const s4 = s * 4, sa = p[s4 + 3];
    if (sa > 200 && Math.abs(p[s4] - fr) + Math.abs(p[s4 + 1] - fg) + Math.abs(p[s4 + 2] - fb) < 8) continue;
    const sr = (p[s4] * sa) / 255, sg = (p[s4 + 1] * sa) / 255, sb = (p[s4 + 2] * sa) / 255;
    const mask = new Uint8Array(N * N);
    const match = (i) => {
      if (bar[i] || mask[i]) return false;
      const i4 = i * 4, a = p[i4 + 3];
      return Math.abs((p[i4] * a) / 255 - sr) + Math.abs((p[i4 + 1] * a) / 255 - sg) + Math.abs((p[i4 + 2] * a) / 255 - sb) + Math.abs(a - sa) <= tol;
    };
    const stack = [s];
    while (stack.length) {
      const i = stack.pop();
      if (!match(i)) continue;
      const y = (i / N) | 0, row = y * N;
      let l = i - row, r = l;
      while (l > 0 && match(row + l - 1)) l--;
      while (r < N - 1 && match(row + r + 1)) r++;
      for (let x = l; x <= r; x++) mask[row + x] = 1;
      for (const ny of [y - 1, y + 1]) {
        if (ny < 0 || ny >= N) continue;
        const nrow = ny * N; let inSpan = false;
        for (let x = l; x <= r; x++) {
          const m = match(nrow + x);
          if (m && !inSpan) { stack.push(nrow + x); inSpan = true; } else if (!m) inSpan = false;
        }
      }
    }
    // Boya kontur çizgisinin altına 2 px taşsın: beyaz hale kalmasın
    for (let pass = 0; pass < 2; pass++) {
      const add = [];
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        const i = y * N + x;
        if (mask[i] || !bar[i]) continue;
        if ((x > 0 && mask[i - 1]) || (x < N - 1 && mask[i + 1]) || (y > 0 && mask[i - N]) || (y < N - 1 && mask[i + N])) add.push(i);
      }
      for (const i of add) mask[i] = 1;
    }
    for (let i = 0; i < mask.length; i++) if (mask[i]) { const i4 = i * 4; p[i4] = fr; p[i4 + 1] = fg; p[i4 + 2] = fb; p[i4 + 3] = 255; changed = true; }
  }
  if (changed) { pctx.putImageData(pimg, 0, 0); dirty = true; }
  return changed;
}

const stroke = { active: false, lastX: 0, lastY: 0, prevX: 0, prevY: 0, midX: 0, midY: 0, w: 0, acc: 0, changed: false, ax: 0, ay: 0, angle: 0, tool: "tahrir" };

    for (const [g, on] of [[pctx, eraseMode !== "contour"], [cctx, eraseMode !== "paint"]]) {

      gr.addColorStop(0, "rgba(0,0,0,.9)"); gr.addColorStop(0.6, "rgba(0,0,0,.6)"); gr.addColorStop(1, "rgba(0,0,0,0)");

      eachSym(g, () => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); });
      g.restore();

  dirty = true;

    Object.assign(stroke, { lastX: x, lastY: y, prevX: x, prevY: y, midX: x, midY: y, acc: 0 });
    return;
  }

    const target = base * Math.min(1.35, Math.max(0.55, 1.35 - v / 1100));

    let pos = spacing - stroke.acc;
    while (pos <= len) { dab(stroke.lastX + (dx * pos) / len, stroke.lastY + (dy * pos) / len); pos += spacing; }

    if (Math.hypot(ddx, ddy) > 14) { stroke.angle = Math.atan2(ddx, -ddy); dirty = true; }

  if (!stroke.active) return;
  stroke.active = false;

    const { midX: mx, midY: my, prevX: px, prevY: py } = stroke;

function videoToScreen(nx, ny) {

// One Euro filtresi: el yavaşken titreşimi güçlü biçimde bastırır,
// hızlı hareket ederken gecikmeyi azaltır.
class OneEuro {
  constructor(minCutoff = 1.0, beta = 0.004, dCutoff = 1.0) { Object.assign(this, { minCutoff, beta, dCutoff, x: null, dx: 0, t: 0 }); }
  static alpha(cutoff, dt) { const tau = 1 / (2 * Math.PI * cutoff); return 1 / (1 + tau / dt); }
  filter(x, t) {
    if (this.x === null) { this.x = x; this.t = t; return x; }
    const dt = Math.max(1e-3, t - this.t); this.t = t;
    this.dx += OneEuro.alpha(this.dCutoff, dt) * ((x - this.x) / dt - this.dx);
    const cutoff = this.minCutoff + this.beta * Math.abs(this.dx);
    this.x += OneEuro.alpha(cutoff, dt) * (x - this.x);
    return this.x;
  }
}

function readHands() {

  lastVideoTime = video.currentTime;

  // İki el varsa sıra kareden kareye değişebilir: önceki konumlara en yakın eşleşmeyi koru
  if (lms.length === 2 && handFilters[0].raw && handFilters[1].raw) {
    const d = (lm, f) => Math.hypot(lm[0].x - f.raw.x, lm[0].y - f.raw.y);
    if (d(lms[0], handFilters[1]) + d(lms[1], handFilters[0]) < d(lms[0], handFilters[0]) + d(lms[1], handFilters[1])) lms = [lms[1], lms[0]];
  }

  for (let h = 0; h < 2; h++) {
    const lm = lms[h];
    if (!lm) { hands[h] = null; handFilters[h] = newHandFilter(); continue; }
    const f = handFilters[h];
    f.raw = { x: lm[0].x, y: lm[0].y };
    const thumb = lm[4], index = lm[8], knuckle = lm[5];
    // Sabit referans noktası: iki parmak ucu + işaret parmağı kökü.
    // Pinch açılıp kapanırken iki uç simetrik yaklaştığı için nokta zıplamaz.
    const nx = thumb.x * 0.35 + index.x * 0.35 + knuckle.x * 0.3;

    const ratio = Math.hypot(thumb.x - index.x, thumb.y - index.y) / size;
    const was = !!hands[h]?.pinch;
    const want = was ? ratio < 0.45 : ratio < 0.32;
    f.pinchVotes = want !== was ? f.pinchVotes + 1 : 0;
    const pinch = f.pinchVotes >= 2 ? want : was;

function screenToTile(x, y) {
  const r = view.getBoundingClientRect();
  const inside = x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  let u = (x - r.left) / r.width, v = (y - r.top) / r.height;

  if (!camOn || mouse.down) list.push({ id: "mouse", x: mouse.x, y: mouse.y, active: mouse.down, hand: false, show: mouse.inside });

function layout() {

  octx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

  const bar = document.getElementById("bar"), tools = document.getElementById("tools"), opts = document.getElementById("opts"), hud = document.querySelector(".hud");
  let top, bottomReserve, left, right;
  if (narrow) {

    tools.style.bottom = bar.offsetHeight + 24 + "px";
    opts.style.top = ""; opts.style.maxHeight = "";
    opts.style.bottom = bar.offsetHeight + tools.offsetHeight + 32 + "px";
    top = hud.getBoundingClientRect().bottom + 12;
    bottomReserve = bar.offsetHeight + tools.offsetHeight + opts.offsetHeight + 52;
    left = 16; right = innerWidth - 16;
  } else {
    tools.style.bottom = ""; opts.style.bottom = "";
    const hb = hud.getBoundingClientRect().bottom;
    opts.style.top = hb + 10 + "px";
    opts.style.maxHeight = Math.max(120, innerHeight - hb - 10 - 16) + "px";
    top = 16; bottomReserve = bar.offsetHeight + 36;
    left = Math.max(hud.getBoundingClientRect().right, opts.getBoundingClientRect().right) + 24;
    right = tools.getBoundingClientRect().left - 24;

  const availW = right - left, availH = innerHeight - top - bottomReserve;
  const s = Math.max(120, Math.min(availW, availH));
  view.style.width = view.style.height = s + "px";

  view.style.top = top + Math.max(0, (availH - s) / 2) + "px";
  dirty = true;
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;

  layers: { paint, contour, view, comp },
  TILE, PALETTE, MOTIFS: Object.keys(MOTIFS), TEMPLATES: Object.keys(TEMPLATES), SYM_MODES,
  selectTool, selectColor, selectMotif, setSymmetry, setGuides, setPano, setEraseMode,
  setPaint: (c) => selectColor(c, c, "paint"),
  setInk: (c) => selectColor(c, c, "ink"),
  setSize: (k) => { sizeEl.value = String(k); dirty = true; },
  applyTemplate,
  strokeStart, strokeMove, strokeEnd,
  stroke: strokePath,                                   // ([[x,y],...], tool?)
  fill: (x, y, c = color) => { snapshot(); showFired = false; const ok = fillAt(x, y, c); if (!ok) undo.pop(); draw(); return ok; },
  stamp: (x, y, o = {}) => { snapshot(); showFired = false; stampAt(x, y, o.angle ?? stampAngle, o); draw(); },
  undo: () => document.getElementById("btnUndo").click(),
  clear: () => document.getElementById("btnClear").click(),
  glaze, fire, downloadPano, panoCanvas,
  draw,
};
</script>
</body>
</html>
